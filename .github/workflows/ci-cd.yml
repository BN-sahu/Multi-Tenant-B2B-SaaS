name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY_API: helpdesk-api
  ECR_REPOSITORY_WEB: helpdesk-web
  EKS_CLUSTER_NAME: helpdesk-cluster

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Linter
      run: npx turbo run lint
      
    - name: Run Unit Tests
      run: npx turbo run test

  build-and-push:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: $
        aws-secret-access-key: $
        aws-region: $
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: Build, tag, and push API image to Amazon ECR
      env:
        ECR_REGISTRY: $
        IMAGE_TAG: $
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG -f apps/api/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_API:$IMAGE_TAG
        
    - name: Build, tag, and push Web image to Amazon ECR
      env:
        ECR_REGISTRY: $
        IMAGE_TAG: $
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG -f apps/web/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_WEB:$IMAGE_TAG

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: $
        aws-secret-access-key: $
        aws-region: $
        
    - name: Update Kubeconfig
      run: aws eks update-kubeconfig --name $EKS_CLUSTER_NAME --region $AWS_REGION
      
    - name: Deploy to Amazon EKS
      env:
        ECR_REGISTRY: $
        IMAGE_TAG: $
      run: |
        # Substitute environment variables in k8s manifests
        envsubst < infra/k8s/api-deployment.yaml | kubectl apply -f -
        envsubst < infra/k8s/web-deployment.yaml | kubectl apply -f -
        kubectl apply -f infra/k8s/ingress.yaml
