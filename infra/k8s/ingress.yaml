apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: helpdesk-ingress
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: ${CERTIFICATE_ARN}
spec:
  rules:
    - host: api.helpdesk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-api-svc
                port:
                  number: 80
    - host: app.helpdesk.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: helpdesk-web-svc
                port:
                  number: 80
